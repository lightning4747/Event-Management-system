name: Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.1'

      - name: Install Dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile

      - name: Dependency Vulnerability Audit
        working-directory: ./backend
        run: bunx audit

      - name: Code Quality & Security Linting
        working-directory: ./backend
        run: bun run lint

      - name: TypeScript Compile Verification
        working-directory: ./backend
        run: bunx tsc --noEmit

      - name: Build Docker Container
        run: |
          docker build -t mcet-backend:latest ./backend

      - name: Scan Container for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mcet-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
