name: Backend CI Pipeline

on:
  push:
    branches: [ main, backend-base ]
  pull_request:
    branches: [ main, backend-base ]

jobs:
  backend-ci:
    name: Lint & Type Check Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.1'

      - name: Install Dependencies
        working-directory: ./backend
        run: bun install 

      - name: Code Quality & Security Linting
        working-directory: ./backend
        run: bun run lint

      - name: TypeScript Compile Verification
        working-directory: ./backend
        run: bunx tsc --noEmit