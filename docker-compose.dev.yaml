version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: od_approval_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcet_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcet_backend
    restart: always
    environment:
      NODE_ENV: development
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:password123@postgres:5432/od_approval_db
      JWT_SECRET: supersecretjwtkeychangeinprod123
      STORAGE_PROVIDER: local
    command: ["bun", "--watch", "src/index.ts"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mcet_network

volumes:
  postgres_data:

networks:
  mcet_network:
    driver: bridge
